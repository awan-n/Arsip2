<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Layanan Digital - PT Indah Bersama</title>
    <style>
        * { box-sizing: border-box; }
        body.login-page {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        .brand-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .brand-logo h2 {
            margin: 0 0 8px 0;
            color: #1e3a8a;
            font-size: 1.6rem;
            font-weight: 700;
        }
        .brand-logo p {
            margin: 0;
            color: #6b7280;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
            text-align: left;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .login-footer {
            text-align: center;
            margin-top: 25px;
            border-top: 1px solid #f3f4f6;
            padding-top: 20px;
        }
        .btn-back {
            color: #4b5563;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .btn-back:hover {
            color: #1e3a8a;
            text-decoration: underline;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="brand-logo">
                <h2>PT Awan Prima Office</h2>
                <p>Sistem Informasi Internal</p>
            </div>
            
            <!-- Form langsung memanggil fungsi JavaScript di bawah -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username / NIP</label>
                    <input type="text" id="username" placeholder="Masukkan Username / NIP" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan Password" required>
                </div>
                
                <div id="loginError" style="display: none; color: #dc2626; margin-bottom: 15px; font-size: 0.875rem; text-align: center;">
                    Username atau password salah! (Gunakan: pimpinan / pim123)
                </div>

                <button type="submit" class="btn-primary">Masuk</button>
            </form>

            <div class="login-footer">
                <a href="Beranda.html" class="btn-back">← Kembali ke Beranda</a>
            </div>
        </div>
    </div>

    <script>
        // Daftar akun (username huruf kecil)
        const AKUN = {
            admin:      { password: 'admin123', peran: 'admin' },
            sekretaris: { password: 'sek123',   peran: 'sekretaris' },
            pimpinan:   { password: 'pim123',   peran: 'pimpinan' }
        };

        function handleLogin(event) {
            // Mencegah form melakukan reload halaman default
            event.preventDefault();

            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('loginError');

            const akun = Object.prototype.hasOwnProperty.call(AKUN, username) ? AKUN[username] : null;

            if (akun && akun.password === password) {
                // Set status login dan peran di localStorage
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('currentUser', username);
                localStorage.setItem('currentRole', akun.peran);

                // Ambil tujuan dari parameter URL (?redirect=arsip.html)
                const urlParams = new URLSearchParams(window.location.search);
                let redirectTo = urlParams.get('redirect');

                // Hanya izinkan nama file .html di folder yang sama; selain itu ke arsip.html
                if (!redirectTo || !/^[\w\-]+\.html$/i.test(redirectTo)) {
                    redirectTo = 'arsip.html';
                }

                window.location.href = redirectTo;
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</html>
